{% set name = "ecell4" %}
{% set version = "1.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/e/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 08691752c9ea788c310e5fd3c25de36f18382ed2b92a7769a4509b87dee2cf0c

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
requirements:
  host:
    - python >=3
    - setuptools
    - pip
    - ecell4_base >=2.1.0
    - matplotlib-base
  run:
    - ecell4_base >=2.1.0
    - matplotlib-base
    - python >=3

test:
  imports:
    - ecell4
    - ecell4.datasource
    - ecell4.extra
    - ecell4.util

about:
  home: https://github.com/ecell/ecell4
  license: GPL-3.0
  license_family: GPL
  license_file: LICENSE
  summary: An integrated software environment for multi-algorithm, multi-timescale, multi-spatial-representation simulation

extra:
  recipe-maintainers:
    - kozo2

