{% set name = "ecell4" %}
{% set version = "1.2.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/e/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 7142f5bed523d3a3235a5ace4d60e2d2ba6c35df468dea6a725e2b090e7772e8

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"
requirements:
  host:
    - python >=3
    - setuptools
    - pip
    - ecell4_base >=2.1.0
    - matplotlib-base
  run:
    - ecell4_base >=2.1.0
    - matplotlib-base
    - python >=3

test:
  imports:
    - ecell4
    - ecell4.datasource
    - ecell4.extra
    - ecell4.util

about:
  home: https://github.com/ecell/ecell4
  license: GPL-3.0
  license_family: GPL
  license_file: LICENSE
  summary: An integrated software environment for multi-algorithm, multi-timescale, multi-spatial-representation simulation

extra:
  recipe-maintainers:
    - kozo2

